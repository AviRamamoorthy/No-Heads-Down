<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No Heads Down</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="description" content="Tools to reset, connect, and step away from the screen.">
<style>
:root{--bg:#FAF7F2;--cream:#F0EADD;--sage:#EAF0E5;--sage2:#C9D8C4;--ink:#1F2321;--mute:#4D534F;--line:#D9D2C3;--green:#3A5442;--green-d:#2B3F32;--fs:100%;--ls:1.65;--ws:0em;--lt:0em;--serif:"Source Serif 4",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html.hc{--bg:#fff;--cream:#fff;--sage:#fff;--sage2:#000;--ink:#000;--mute:#000;--line:#000;--green:#000;--green-d:#000}
html{font-size:var(--fs);scroll-padding-top:7rem}
html.sp{--ls:2;--ws:.16em;--lt:.04em}
html.dys{--serif:Lexend,OpenDyslexic,"Comic Sans MS",sans-serif;--sans:Lexend,OpenDyslexic,"Comic Sans MS",sans-serif}
html.ul a{text-decoration:underline!important}
html.rm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:var(--ls);word-spacing:var(--ws);letter-spacing:var(--lt);-webkit-font-smoothing:antialiased;font-kerning:normal}
button,input,textarea{font-family:var(--sans)}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0 0 .6em}
h1{font-size:clamp(2.4rem,6vw,4.4rem);letter-spacing:0}h2{font-size:clamp(1.7rem,3.4vw,2.5rem)}h3{font-size:1.3rem}
p{margin:0 0 1em;max-width:62ch}
a{color:var(--green-d)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;box-shadow:0 0 0 6px var(--bg)}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:#fff;padding:.8rem 1rem;z-index:100}.skip:focus{left:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 1.5rem}
section{padding:4.5rem 0}.alt{background:var(--sage)}
.eyebrow{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--green);margin-bottom:.8rem}
header.nav{position:sticky;top:0;background:var(--bg);border-bottom:3px solid var(--sage2);z-index:50}
.nav .wrap{display:flex;align-items:center;gap:.5rem 1.5rem;min-height:4.75rem;flex-wrap:wrap;padding-top:.4rem;padding-bottom:.4rem}
.logo-slot{position:relative;flex:none;display:flex;align-items:center;justify-content:center;width:3.25rem;height:3.25rem;border:1.5px solid var(--green);background:var(--sage);border-radius:50%;font-size:.62rem;font-weight:600;letter-spacing:.08em;color:var(--green)}
.logo-slot img{height:3.25rem;width:auto;max-width:none;display:block}
.logo-slot.empty img{position:absolute;opacity:0;pointer-events:none}
.logo-slot:not(.empty){width:auto;border:0;background:none;border-radius:0}
.logo-slot:not(.empty) .lbl{display:none}
.wordmark{font-weight:700;font-size:1.05rem;letter-spacing:.06em;color:var(--ink);white-space:nowrap}
.brand{display:flex;align-items:center;gap:.8rem;text-decoration:none;margin-right:auto}
.nav ul{display:flex;gap:.25rem;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.nav ul a{display:block;padding:.7rem .9rem;text-decoration:none;color:var(--ink);border-bottom:3px solid transparent;font-weight:500}
.nav ul a:hover{border-color:var(--sage2)}
.nav ul a[aria-current=page]{border-color:var(--green);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:2.9rem;padding:.7rem 1.4rem;border-radius:6px;border:2px solid var(--ink);background:var(--ink);color:#fff;font-family:var(--sans);font-weight:600;font-size:1rem;line-height:1;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--green-d);border-color:var(--green-d)}
.btn.ghost{background:transparent;color:var(--ink)}.btn.ghost:hover{background:var(--sage);color:var(--ink);border-color:var(--ink)}
html.hc .btn{background:#000;color:#fff}html.hc .btn.ghost{background:#fff;color:#000}
@media(max-width:700px){.nav .wrap{justify-content:space-between}.nav nav{order:3;width:100%}.nav ul a{padding:.6rem .55rem;font-size:.97rem}.brand{margin-right:0}}
.hero{padding:4.5rem 0}.hero h1{letter-spacing:.03em}
.grid2,.split{display:grid;grid-template-columns:1fr 1.15fr;gap:3.5rem;align-items:center}
.split{grid-template-columns:1fr 1fr}
.hero .lead,.lead{font-size:1.25rem}.row{display:flex;gap:.9rem;flex-wrap:wrap;margin-top:1.8rem}
@media(max-width:860px){.grid2,.split{grid-template-columns:1fr}}
.ph{position:relative;margin:0;background:var(--sage);border:1px solid var(--sage2);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;min-height:200px;color:var(--mute);font-size:.9rem}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph span{padding:1rem;max-width:30ch}
.r43{aspect-ratio:4/3}.r54{aspect-ratio:5/4}.r169{aspect-ratio:16/9}.r11{aspect-ratio:1/1}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
.duo>*{min-width:0;width:100%;justify-self:center}.duo .ph{min-height:0}
@media(max-width:600px){.duo{grid-template-columns:1fr}}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem}
@media(max-width:860px){.three{grid-template-columns:1fr}}
.prod h3{margin-top:1.1rem}.prod p{margin-bottom:.8rem}
.list{list-style:none;padding:0;margin:1.2rem 0}.list li{padding:.8rem 0;border-top:1px solid var(--sage2)}.list li:last-child{border-bottom:1px solid var(--sage2)}
.cta-band{background:var(--ink);color:#fff;text-align:center;padding:5rem 0;border-top:6px solid var(--sage2)}
.cta-band p{margin-inline:auto}.cta-band .btn{background:#fff;color:var(--ink);border-color:#fff}
.cta-band .row{justify-content:center}
html.hc .cta-band{background:#000}
.page-head{padding:4rem 0 3rem}
.center{text-align:center}.center p{margin-inline:auto}.center .row,.center .switch,.center .chips{justify-content:center}.card{text-align:left}.note{margin-inline:auto}.founder{aspect-ratio:4/5;max-width:440px;width:100%;justify-self:center}.founder img{object-position:center 25%}.hero-img{max-width:960px;margin:3rem auto 0}
.switch{display:flex;gap:.5rem;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:1.5rem 0 2rem}
.switch a{padding:.9rem 1.1rem;min-height:2.9rem;text-decoration:none;color:var(--ink);border-bottom:3px solid transparent;font-weight:600}
.switch a:hover{background:var(--sage)}.switch a[aria-current=page]{border-color:var(--green)}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin:2rem 0}
.gal .first{grid-column:1/-1}
.gal4{grid-template-columns:repeat(4,1fr)}.r35{aspect-ratio:3/5}
@media(max-width:860px){.gal4{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.gal{grid-template-columns:1fr}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1.5rem}
.card{background:#fff;border:1px solid var(--ink);border-top:5px solid var(--green);border-radius:8px;padding:1.5rem;display:flex;flex-direction:column}
.journal{background:#fffdf8}
.cat{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--green)}
textarea{width:100%;min-height:7rem;border:1px solid var(--line);border-radius:6px;padding:.7rem;font:inherit;background:#fff;color:var(--ink);margin-top:.8rem}
.note{border-left:4px solid var(--green);background:var(--sage);padding:1rem 1.2rem;margin:1.5rem 0;max-width:70ch}
.note.mid{border-left:0;border-top:4px solid var(--green);text-align:center;margin:1.5rem auto}
.card.journal{text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:.6rem;list-style:none;padding:0;margin:1rem 0 2rem}
.chips li{border:1px solid var(--green);background:var(--sage);border-radius:6px;padding:.4rem .9rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin:2rem 0}
@media(max-width:860px){.steps{grid-template-columns:1fr 1fr}}@media(max-width:520px){.steps{grid-template-columns:1fr}}
.step{border-top:3px solid var(--green);padding-top:1rem}.step b{display:block;font-size:.78rem;letter-spacing:.14em;color:var(--green)}
.step span{font-family:var(--serif);font-size:1.3rem}
footer{background:var(--sage);border-top:3px solid var(--sage2);padding:3rem 0;font-size:.95rem}
footer .wrap{display:flex;gap:1.5rem 2rem;flex-wrap:wrap;align-items:center;justify-content:space-between}
footer .logo-slot{width:3.75rem;height:3.75rem}footer .logo-slot img{height:3.75rem}footer .logo-slot:not(.empty){width:auto}footer nav a{margin-right:1.2rem}
footer .tag{font-family:var(--serif);font-size:1.2rem;margin:0}
#a11y-btn{position:fixed;right:1rem;bottom:1rem;z-index:60;min-height:3rem;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#a11y{position:fixed;right:1rem;bottom:4.5rem;z-index:60;width:min(320px,calc(100vw - 2rem));background:#fff;color:#000;border:2px solid #000;border-radius:8px;padding:1.2rem;display:none}
#a11y.open{display:block}#a11y h2{font-size:1.2rem;margin-bottom:.8rem}
#a11y label{display:flex;gap:.7rem;align-items:center;min-height:2.75rem}#a11y input{width:1.3rem;height:1.3rem}
#a11y .row{margin-top:.8rem}#a11y .btn{min-height:2.75rem;padding:.5rem 1rem}
</style>
</head>

const $=(s,r=document)=>r.querySelector(s);

function ProductImage(src,alt,cls=""){
 return `<figure class="ph ${cls}"><span aria-hidden="true">Image placeholder: add <code>${src.startsWith("data:")?"image":esc(src)}</code></span><img src="${esc(src)}" alt="${esc(alt)}" onerror="this.remove()"></figure>`;}
function Logo(){return `<img src="${IMAGES.logo}" alt="No Heads Down" onload="this.parentNode.classList.remove('empty')" onerror="this.remove()"><span class="lbl">LOGO</span>`;}
const ProductCard=k=>`<article class="prod">${ProductImage(IMAGES[k][0],products[k].name+" product photo","r54")}<h3>${products[k].name}</h3><p>${products[k].desc}</p><a class="btn ghost" href="#/tools/${k}">View ${products[k].name}</a></article>`;
const CTASection=(h,p,btns)=>`<section class="cta-band"><div class="wrap"><h2>${h}</h2><p>${p}</p><div class="row">${btns}</div></div></section>`;
const Switch=cur=>`<nav class="switch" aria-label="Toolkit products">${Object.keys(products).map(k=>`<a href="#/tools/${k}" ${k===cur?'aria-current="page"':""}>${products[k].name}</a>`).join("")}</nav>`;
const Gallery=k=>`<div class="gal${k==="reset"?" gal4":""}">${IMAGES[k].map((s,i)=>ProductImage(s,(ALT[k]&&ALT[k][i])||`${products[k].name}, photo ${i+1}`,i?(k==="reset"?"r35":"r43"):"first r169")).join("")}</div>`;

/* ===== pages ===== */
const pages={
home:()=>`
<section class="hero"><div class="wrap center">
  <p class="eyebrow">The Connection Toolkit</p><h1>NO HEADS DOWN</h1>
  <p class="lead">Tools to reset, connect, and step away from the screen.</p>
  <div class="row"><a class="btn" href="#/tools">Explore the Tools</a><a class="btn ghost" href="#/educators">For Educators</a></div>
  <div class="hero-img">${ProductImage(IMAGES.toolkit,"The No Heads Down Connection Toolkit","r169")}</div>
</div></section>

<section class="alt"><div class="wrap split"><div><p class="eyebrow">Mission</p>
  <p class="lead" style="font-size:1.15rem">No Heads Down helps neurodivergent students build a healthier relationship with technology through simple tools that encourage them to reset, connect with others, reflect, and engage offline.</p></div>
  <div><p class="eyebrow">Vision</p><p class="lead" style="font-size:1.15rem">To create a future where every neurodivergent student has opportunities to feel connected, supported, and engaged both on and beyond the screen.</p></div></div></section>

<section><div class="wrap split"><div><p class="eyebrow">The problem</p><h2>Technology isn't the problem.</h2>
  <p>Screens help students learn, communicate, and create. But for many neurodivergent students, it can be hard to step away, settle, and start a conversation with a peer. Classrooms often don't have simple, structured ways to make room for that.</p></div>
  <div><p class="eyebrow">What we made</p><h2>A physical toolkit.</h2>
  <p>The No Heads Down Connection Toolkit has three parts: Reset Cards, Connection Cards, and Journaling Prompts. Short, predictable activities give students ways to reset, connect, reflect, and spend time offline. They are made for grades 2–8 and are easy to pick up and use.</p></div></div></section>

<section class="alt"><div class="wrap"><div class="duo">
  ${ProductImage(IMAGES.home[0],"No Heads Down toolkit photo 1","r43")}${ProductImage(IMAGES.home[1],"No Heads Down toolkit photo 2","r43")}</div></div></section>
${CTASection("Explore the tools","See the three parts of the toolkit.",'<a class="btn" href="#/tools">Explore the Tools</a>')}`,

tools:()=>`
<div class="wrap page-head center"><h1>Tools</h1><p class="lead">The No Heads Down toolkit has three parts.</p>
<div class="three" style="margin-top:2.5rem">${Object.keys(products).map(ProductCard).join("")}</div></div>`,

tool:k=>{const p=products[k];return `
<div class="wrap page-head center"><p class="eyebrow">Tools</p><h1>${p.name}</h1><p class="lead">${p.desc}</p>${Switch(k)}
${Gallery(k)}
${p.list?`<h2 style="font-size:1.4rem">${p.listLabel}</h2><ul class="chips">${p.list.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}
${k==="journal"?`<h2>Try the prompts</h2><div class="note mid">This is for you. What you type on this page stays on this page and is never sent or saved.</div>
<div class="cards">${journalPrompts.map((q,i)=>`<article class="card journal"><h3>“${q}”</h3><label for="j${i}" class="cat">Write your answer (optional)</label><textarea id="j${i}"></textarea></article>`).join("")}</div>`:""}
</div>`},

educators:()=>`
<div class="wrap page-head center"><p class="eyebrow">For Educators</p><h1>Why use No Heads Down?</h1>
<p class="lead">It fits into the routines you already have.</p></div>
<section style="padding-top:1rem"><div class="wrap split"><div>
 <ul class="list"><li><b>Low preparation.</b> Pick a card and start. No long setup.</li>
 <li><b>Structured.</b> Every activity has clear, short steps.</li>
 <li><b>Flexible.</b> Use it for arrival, transitions, small groups, or the end of class.</li>
 <li><b>Easy to adapt.</b> Shorten an activity, skip a step, or change it for your students.</li>
 <li><b>Made with neurodivergent students in mind.</b></li></ul></div>
 ${ProductImage(IMAGES.toolkit,"The toolkit on a classroom table","r43")}</div></section>
<section class="alt"><div class="wrap center"><h2>One way to use it</h2>
 <div class="steps"><div class="step"><b>ARRIVAL</b><span>Quick Reset</span></div><div class="step"><b>TRANSITION</b><span>Movement or Grounding</span></div><div class="step"><b>SMALL GROUP</b><span>Connection Card</span></div><div class="step"><b>END OF CLASS</b><span>Journaling Prompt</span></div></div></div></section>
<section><div class="wrap split"><div><h2>Designed with choice in mind.</h2>
 <p>Students have different sensory, communication, and social needs. The toolkit offers options instead of one right way to regulate or connect. Students choose whether to take part, and no one has to share personal information.</p></div>
 <div class="note"><b>Instruction guide</b><br>${GUIDE_PDF?`<a class="btn" style="margin-top:.8rem" href="${esc(GUIDE_PDF)}" download>Download the instruction guide (PDF)</a>`:"Coming soon."}</div></div></section>`,

about:()=>`
<div class="wrap page-head center"><p class="eyebrow">About</p><h1>Why we started No Heads Down</h1></div>
<section style="padding-top:1rem"><div class="wrap split"><div>
 <p class="lead">Technology can be valuable. But students also need time for human connection, regulation, reflection, and offline activities.</p>
 <p>We created No Heads Down after seeing how valuable technology can be for neurodivergent students, while also recognizing the importance of having meaningful ways to step away from the screen.</p></div>
 ${ProductImage(IMAGES.toolkit,"The No Heads Down toolkit","r43")}</div></section>
<section class="alt"><div class="wrap split">${ProductImage(IMAGES.founders,"Avanti Ramamoorthy, founder of No Heads Down","founder")}
 <div><p class="eyebrow">Our story</p><h2>Meet Avanti</h2>${founderStory.map(t=>`<p>${t}</p>`).join("")}</div></div></section>
<section><div class="wrap center"><h2>Reach us</h2><p>Questions about the toolkit? We'd like to hear from you.</p>
 <p><a href="mailto:${CONTACT_EMAIL}">${CONTACT_EMAIL}</a></p>
 <a class="btn" href="mailto:${CONTACT_EMAIL}">Email us</a></div></section>`
};

/* ===== router ===== */
const titles={home:"No Heads Down",tools:"Tools | No Heads Down",educators:"For Educators | No Heads Down",about:"About | No Heads Down"};
let route="";try{route=location.hash.slice(2)}catch(e){}
function go(p){route=p;try{history.pushState(null,"","#/"+p)}catch(e){}render()}
document.addEventListener("click",e=>{const l=e.target.closest('a[href^="#/"]');if(!l)return;e.preventDefault();go(l.getAttribute("href").slice(2))});
function render(focus=true){
 const [a,b]=(route||"home").split("/");
 const page=pages[a]&&a!=="tool"?a:"home";
 const k=page==="tools"&&products[b]?b:null;
 $("#main").innerHTML=k?pages.tool(k):pages[page]();
 document.title=k?`${products[k].name} | No Heads Down`:titles[page];
 document.querySelectorAll("#menu a").forEach(l=>{const h=l.getAttribute("href").slice(2)||"home";h===page?l.setAttribute("aria-current","page"):l.removeAttribute("aria-current")});
 if(focus){$("#main").focus({preventScroll:true});scrollTo(0,0)}
}
addEventListener("hashchange",()=>{route=location.hash.slice(2);render()});addEventListener("popstate",()=>{route=location.hash.slice(2);render()});
$("#brand").innerHTML=Logo();$("#foot-brand").innerHTML=Logo();

/* ===== accessibility settings ===== */
const KEY="nhd-a11y";let prefs={size:0,hc:0,rm:0,sp:0,ul:0,dys:0};
try{Object.assign(prefs,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
function applyPrefs(){const r=document.documentElement;
 r.style.setProperty("--fs",(100+prefs.size*12.5)+"%");
 ["hc","rm","sp","ul","dys"].forEach(k=>r.classList.toggle(k,!!prefs[k]));
 document.querySelectorAll("[data-opt]").forEach(i=>i.checked=!!prefs[i.dataset.opt]);
 $("#size-lbl").textContent="Size "+(100+prefs.size*12.5)+"%";
 try{localStorage.setItem(KEY,JSON.stringify(prefs))}catch(e){}}
$("#a11y-btn").onclick=e=>{const o=$("#a11y").classList.toggle("open");e.target.setAttribute("aria-expanded",o)};
$("#a11y").addEventListener("keydown",e=>{if(e.key==="Escape"){$("#a11y").classList.remove("open");$("#a11y-btn").setAttribute("aria-expanded","false");$("#a11y-btn").focus()}});
document.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>{prefs.size=Math.max(-1,Math.min(4,prefs.size+ +b.dataset.size));applyPrefs()});
document.querySelectorAll("[data-opt]").forEach(i=>i.onchange=()=>{prefs[i.dataset.opt]=i.checked?1:0;applyPrefs()});
$("#a11y-reset").onclick=()=>{prefs={size:0,hc:0,rm:0,sp:0,ul:0,dys:0};applyPrefs()};
applyPrefs();render(false);
</script>
</body>
